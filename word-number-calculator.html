<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word to Number Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#10121b;color:#f7f4ed;font:16px system-ui,Arial,sans-serif}.wrap{max-width:820px;margin:50px auto;padding:24px}h1{font-size:clamp(30px,6vw,48px);margin-bottom:5px}.sub{color:#d7ba78;margin-bottom:30px}input{width:100%;padding:17px;border-radius:12px;border:2px solid #bd9a52;background:#202431;color:white;font-size:22px}.key{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:24px 0}.cell{text-align:center;background:#232838;padding:12px 2px;border-radius:8px}.cell strong{display:block;font-size:24px;color:#f2d08a}.cell small{font-size:12px;color:#d4d8e2}.results{background:#202431;padding:22px;border-radius:14px}.breakdown{line-height:2;overflow-wrap:anywhere;color:#e6d2a6}.totals{display:flex;gap:20px;flex-wrap:wrap}.stat{flex:1;min-width:150px}.stat b{font-size:42px;display:block;color:#f2d08a}.stat span{color:#ccd0da}button{margin-top:18px;background:#cba75f;color:#14151a;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}footer{margin-top:30px;color:#adb3c2;font-size:13px}@media(max-width:540px){.wrap{margin:10px auto;padding:15px}.cell{padding:10px 0}.cell strong{font-size:19px}.cell small{font-size:10px}}</style></head><body><main class="wrap"><h1>Word to Number Calculator</h1><p class="sub">Discover the numbers behind any word or phrase.</p><label for="phrase">Enter a word, name, or phrase</label><input id="phrase" value="FREEMASON" autocomplete="off" maxlength="500"><div class="key" id="key"></div><section class="results" aria-live="polite"><h2>Your calculation</h2><p class="breakdown" id="breakdown"></p><div class="totals"><div class="stat"><span>Total value</span><b id="total">0</b></div><div class="stat"><span>Reduced value</span><b id="reduced">0</b></div></div><button id="copy">Copy result</button></section><footer>Uses the repeating 1–9 Pythagorean letter-number mapping. Numerology is an interpretive tradition, not a scientifically validated way to determine meaning.</footer></main><script>const groups=['AJS','BKT','CLU','DMV','ENW','FOX','GPY','HQZ','IR'];document.getElementById('key').innerHTML=groups.map((g,i)=>`<div class="cell"><strong>${i+1}</strong><small>${g}</small></div>`).join('');const input=document.getElementById('phrase'),breakdown=document.getElementById('breakdown'),totalEl=document.getElementById('total'),reducedEl=document.getElementById('reduced');let current='';function update(){const letters=input.value.toUpperCase().match(/[A-Z]/g)||[];const values=letters.map(c=>(c.charCodeAt(0)-65)%9+1);const total=values.reduce((a,b)=>a+b,0);const reduced=total?1+(total-1)%9:0;breakdown.textContent=letters.length?letters.map((c,i)=>`${c}(${values[i]})`).join(' + '):'Enter a word or phrase to begin.';totalEl.textContent=total;reducedEl.textContent=reduced;current=`${input.value}: ${breakdown.textContent} = ${total} (reduced: ${reduced})`;}input.addEventListener('input',update);document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);document.getElementById('copy').textContent='Copied!';setTimeout(()=>document.getElementById('copy').textContent='Copy result',1500)}catch(e){window.prompt('Copy this result:',current)}});update();</script></body></html>
